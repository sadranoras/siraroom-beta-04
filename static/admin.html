<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت | {site}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar"><div class="container">
    <a class="brand" href="./">پنل مدیریت · <b data-site-name></b></a>
    <nav class="row"><a class="btn sm" href="dashboard.html">داشبورد من</a><button class="btn sm" id="logout">خروج</button></nav>
  </div></header>
  <main class="container" style="padding-top:1.5rem;padding-bottom:3rem">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">نمای کلی</button>
      <button class="tab" data-tab="users">کاربران</button>
      <button class="tab" data-tab="rooms">اتاق‌ها</button>
      <button class="tab" data-tab="plans">پلن‌ها</button>
      <button class="tab" data-tab="payments">پرداخت‌ها <span class="badge warn hidden" id="pay-badge"></span></button>
      <button class="tab" data-tab="settings">تنظیمات</button>
    </div>
    <section id="v"></section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
